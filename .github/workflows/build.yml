name: Build FUSION Cloud container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ATOMICXR FUSION Cloud: OpenDroneMap NodeODM 3.6.2 + FUSION worker
          tags: |
            ghcr.io/${{ github.repository_owner }}/fusion-cloud:3.6.2
            ghcr.io/${{ github.repository_owner }}/fusion-cloud:latest
            ghcr.io/${{ github.repository_owner }}/fusion-cloud:${{ github.sha }}
